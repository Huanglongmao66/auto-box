name: Build All Platforms

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      platform:
        description: '构建平台 (all/android/desktop/web/linux-tv)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - desktop
          - web
          - linux-tv

env:
  GRADLE_OPTS: '-Xmx4096M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ===== 预处理：解析构建平台 =====
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      build_android: ${{ steps.parse.outputs.build_android }}
      build_desktop: ${{ steps.parse.outputs.build_desktop }}
      build_web: ${{ steps.parse.outputs.build_web }}
      build_linux_tv: ${{ steps.parse.outputs.build_linux_tv }}
    steps:
      - id: parse
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          echo "Requested platform: $PLATFORM"
          case "$PLATFORM" in
            all)
              echo "build_android=true"  >> $GITHUB_OUTPUT
              echo "build_desktop=true"  >> $GITHUB_OUTPUT
              echo "build_web=true"      >> $GITHUB_OUTPUT
              echo "build_linux_tv=true" >> $GITHUB_OUTPUT
              ;;
            android)
              echo "build_android=true"  >> $GITHUB_OUTPUT
              echo "build_desktop=false" >> $GITHUB_OUTPUT
              echo "build_web=false"     >> $GITHUB_OUTPUT
              echo "build_linux_tv=false">> $GITHUB_OUTPUT
              ;;
            desktop)
              echo "build_android=false" >> $GITHUB_OUTPUT
              echo "build_desktop=true"  >> $GITHUB_OUTPUT
              echo "build_web=false"     >> $GITHUB_OUTPUT
              echo "build_linux_tv=false">> $GITHUB_OUTPUT
              ;;
            web)
              echo "build_android=false" >> $GITHUB_OUTPUT
              echo "build_desktop=false" >> $GITHUB_OUTPUT
              echo "build_web=true"      >> $GITHUB_OUTPUT
              echo "build_linux_tv=false">> $GITHUB_OUTPUT
              ;;
            linux-tv)
              echo "build_android=false" >> $GITHUB_OUTPUT
              echo "build_desktop=false" >> $GITHUB_OUTPUT
              echo "build_web=false"     >> $GITHUB_OUTPUT
              echo "build_linux_tv=true" >> $GITHUB_OUTPUT
              ;;
          esac

  # ===== Android APK 构建 =====
  build-android:
    name: Build Android APK
    needs: prepare
    if: needs.prepare.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :app:app-android:assembleDebug --no-daemon --stacktrace

      - name: Build Android Release APK
        run: ./gradlew :app:app-android:assembleRelease --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-android-apk
          path: |
            app/app-android/build/outputs/apk/debug/*.apk
            app/app-android/build/outputs/apk/release/*.apk
          retention-days: 30

  # ===== Desktop (Windows/macOS/Linux) 构建 =====
  build-desktop:
    name: Build Desktop (${{ matrix.label }})
    needs: prepare
    if: needs.prepare.outputs.build_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Grant execute permission for gradlew (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build Desktop Distribution
        shell: bash
        run: ./gradlew :app:app-desktop:packageDistributionForCurrentOS --no-daemon --stacktrace

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-desktop-${{ matrix.label }}
          path: |
            app/app-desktop/build/compose/binaries/main/deb/*.deb
            app/app-desktop/build/compose/binaries/main/msi/*.msi
            app/app-desktop/build/compose/binaries/main/dmg/*.dmg
            app/app-desktop/build/compose/binaries/main/exe/*.exe
            app/app-desktop/build/compose/binaries/main/pkg/*.pkg
          retention-days: 30
          if-no-files-found: warn

  # ===== Web 静态资源构建 =====
  build-web:
    name: Build Web (JS)
    needs: prepare
    if: needs.prepare.outputs.build_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Web Bundle
        run: ./gradlew :app:app-web:jsBrowserProductionWebpack --no-daemon --stacktrace

      - name: Locate & Package Web into ZIP
        run: |
          # Compose/JS 的生产构建输出目录可能位于以下位置之一
          CANDIDATES=(
            "app/app-web/build/dist/js/productionExecutable"
            "app/app-web/build/dist/js/productionExecutable/webpack"
            "app/app-web/build/webpack"
            "app/app-web/build/distributions"
          )
          WEB_DIR=""
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ] && [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              # 如果存在 index.html 优先采用
              if [ -f "$d/index.html" ]; then
                WEB_DIR="$d"
                break
              elif [ -z "$WEB_DIR" ]; then
                WEB_DIR="$d"
              fi
            fi
          done
          # 兜底：全盘搜索最近一次 build 的 index.html
          if [ -z "$WEB_DIR" ]; then
            FOUND=$(find app/app-web/build -name "index.html" -type f -print 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then WEB_DIR=$(dirname "$FOUND"); fi
          fi
          if [ -z "$WEB_DIR" ]; then
            echo "::error::Cannot find Web build output directory under app/app-web/build"
            find app/app-web/build -maxdepth 5 -type d 2>/dev/null | head -60 || true
            exit 1
          fi
          echo "Using Web output directory: $WEB_DIR"
          ls -la "$WEB_DIR"
          (cd "$WEB_DIR" && zip -r "${{ github.workspace }}/tvbox-web.zip" .)

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-web
          path: tvbox-web.zip
          retention-days: 30

  # ===== Linux TV 应用构建 (JVM distribution) =====
  build-linux-tv:
    name: Build Linux TV (JVM)
    needs: prepare
    if: needs.prepare.outputs.build_linux_tv == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux TV Distribution (ZIP + TAR)
        run: |
          # 先执行 installDist，产出完整的 bin/ + lib/ 目录（含全部依赖）
          ./gradlew :app:app-linux-tv:installDist --no-daemon --stacktrace
          # 再执行 distZip / distTar（保证 zip/tar 中包含全部运行时依赖）
          ./gradlew :app:app-linux-tv:distZip :app:app-linux-tv:distTar --no-daemon --stacktrace
          # 同时用 installDist 的目录再打一份保险 zip（大小更直观）
          INSTALL_DIR="app/app-linux-tv/build/install/TVBox"
          if [ -d "$INSTALL_DIR" ]; then
            (cd "$INSTALL_DIR/.." && zip -r "${{ github.workspace }}/tvbox-linux-tv-full.zip" "TVBox")
            tar -cf "${{ github.workspace }}/tvbox-linux-tv-full.tar" -C "$INSTALL_DIR/.." "TVBox"
          fi
          # 打印 distributions 目录，方便确认大小
          echo "==== distributions 目录 ===="
          ls -lh app/app-linux-tv/build/distributions/ || true
          echo "==== workspace 根 ===="
          ls -lh "${{ github.workspace }}"/*.zip "${{ github.workspace }}"/*.tar 2>/dev/null || true

      - name: Upload Linux TV Distribution
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-linux-tv
          path: |
            app/app-linux-tv/build/distributions/*.zip
            app/app-linux-tv/build/distributions/*.tar
            tvbox-linux-tv-full.zip
            tvbox-linux-tv-full.tar
          retention-days: 30

  # ===== 汇总发布 (仅 tag 触发) =====
  release:
    name: Publish Release
    needs: [build-android, build-desktop, build-web, build-linux-tv]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.build-android.result == 'success' ||
       needs.build-desktop.result == 'success' ||
       needs.build-web.result == 'success' ||
       needs.build-linux-tv.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List Artifacts
        run: find artifacts -type f | head -80

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TVBox ${{ github.ref_name }}
          body: |
            ## TVBox Multiplatform ${{ github.ref_name }}

            ### 下载说明
            - **Android**: 安装 `.apk` 文件到 Android TV / 手机 / 平板
            - **Windows**: 下载 `.msi` 或 `.exe` 安装包运行安装
            - **macOS**: 下载 `.dmg` 磁盘映像，拖入 Applications
            - **Linux (Debian/Ubuntu)**: 下载 `.deb` 包，`sudo dpkg -i xxx.deb`
            - **Web**: 下载 `tvbox-web.zip`，解压后用浏览器打开 `index.html`
            - **Linux TV / 嵌入式盒子**: 下载 `tvbox-linux-tv-*.zip`，解压后执行 `bin/TVBox`

            ### 构建信息
            - 构建时间: ${{ github.run_id }}
            - 提交哈希: ${{ github.sha }}
            - 工作流: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            artifacts/**/*.apk
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.pkg
            artifacts/**/tvbox-web.zip
            artifacts/**/*.zip
            artifacts/**/*.tar
          draft: false
          prerelease: false
