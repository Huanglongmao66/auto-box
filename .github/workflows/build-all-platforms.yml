name: Build All Platforms

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      platform:
        description: '构建平台 (all/android/desktop/web/linux-tv)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - desktop
          - web
          - linux-tv

env:
  GRADLE_OPTS: '-Xmx4096M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ===== 预处理：解析构建平台 =====
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      build_android: ${{ steps.parse.outputs.build_android }}
      build_desktop: ${{ steps.parse.outputs.build_desktop }}
      build_web: ${{ steps.parse.outputs.build_web }}
      build_linux_tv: ${{ steps.parse.outputs.build_linux_tv }}
    steps:
      - id: parse
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          echo "Requested platform: $PLATFORM"
          case "$PLATFORM" in
            all)
              echo "build_android=true"  >> $GITHUB_OUTPUT
              echo "build_desktop=true"  >> $GITHUB_OUTPUT
              echo "build_web=true"      >> $GITHUB_OUTPUT
              echo "build_linux_tv=true" >> $GITHUB_OUTPUT
              ;;
            android)
              echo "build_android=true"  >> $GITHUB_OUTPUT
              echo "build_desktop=false" >> $GITHUB_OUTPUT
              echo "build_web=false"     >> $GITHUB_OUTPUT
              echo "build_linux_tv=false">> $GITHUB_OUTPUT
              ;;
            desktop)
              echo "build_android=false" >> $GITHUB_OUTPUT
              echo "build_desktop=true"  >> $GITHUB_OUTPUT
              echo "build_web=false"     >> $GITHUB_OUTPUT
              echo "build_linux_tv=false">> $GITHUB_OUTPUT
              ;;
            web)
              echo "build_android=false" >> $GITHUB_OUTPUT
              echo "build_desktop=false" >> $GITHUB_OUTPUT
              echo "build_web=true"      >> $GITHUB_OUTPUT
              echo "build_linux_tv=false">> $GITHUB_OUTPUT
              ;;
            linux-tv)
              echo "build_android=false" >> $GITHUB_OUTPUT
              echo "build_desktop=false" >> $GITHUB_OUTPUT
              echo "build_web=false"     >> $GITHUB_OUTPUT
              echo "build_linux_tv=true" >> $GITHUB_OUTPUT
              ;;
          esac

  # ===== Android APK 构建 =====
  build-android:
    name: Build Android APK
    needs: prepare
    if: needs.prepare.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :app:app-android:assembleDebug --no-daemon --stacktrace

      - name: Build Android Release APK
        run: ./gradlew :app:app-android:assembleRelease --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-android-apk
          path: |
            app/app-android/build/outputs/apk/debug/*.apk
            app/app-android/build/outputs/apk/release/*.apk
          retention-days: 30

  # ===== Desktop (Windows/macOS/Linux) 构建 =====
  build-desktop:
    name: Build Desktop (${{ matrix.label }})
    needs: prepare
    if: needs.prepare.outputs.build_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Grant execute permission for gradlew (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build Desktop Distribution
        shell: bash
        run: ./gradlew :app:app-desktop:packageDistributionForCurrentOS --no-daemon --stacktrace

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-desktop-${{ matrix.label }}
          path: |
            app/app-desktop/build/compose/binaries/main/deb/*.deb
            app/app-desktop/build/compose/binaries/main/msi/*.msi
            app/app-desktop/build/compose/binaries/main/dmg/*.dmg
            app/app-desktop/build/compose/binaries/main/exe/*.exe
            app/app-desktop/build/compose/binaries/main/pkg/*.pkg
          retention-days: 30
          if-no-files-found: warn

  # ===== Web 静态资源构建 =====
  build-web:
    name: Build Web (JS)
    needs: prepare
    if: needs.prepare.outputs.build_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Web Bundle
        run: ./gradlew :app:app-web:jsBrowserProductionWebpack --no-daemon --stacktrace

      - name: Locate & Package Web into ZIP
        run: |
          # Kotlin Multiplatform + Compose Web 的 webpack 输出目录可能位于多个位置
          # 1) 先打印整个 build 目录结构用于调试（只显示目录 + *.html / *.js 文件）
          echo "==== 构建后 app/app-web/build 中 *.html 文件 ===="
          find app/app-web/build -name "*.html" -type f -print 2>/dev/null || true
          echo "==== 构建后 build 下的目录结构（深度<=6） ===="
          find app/app-web/build -maxdepth 6 -type d 2>/dev/null || true
          # 2) 优先找包含 index.html 的目录，选修改时间最新的
          TARGET=""
          INDEXES=$(find app/app-web/build -name "index.html" -type f -print 2>/dev/null)
          if [ -n "$INDEXES" ]; then
            TARGET=$(ls -1t $INDEXES 2>/dev/null | head -1 | xargs -I{} dirname {})
          fi
          # 3) 如果没有 index.html，回退到候选列表中第一个存在且非空的目录
          if [ -z "$TARGET" ]; then
            CANDIDATES=(
              "app/app-web/build/kotlin-webpack/js/productionExecutable"
              "app/app-web/build/dist/js/productionExecutable"
              "app/app-web/build/webpack/main/productionExecutable"
              "app/app-web/build/dist/js/productionExecutable/webpack"
              "app/app-web/build/dist/webpack"
            )
            for d in "${CANDIDATES[@]}"; do
              if [ -d "$d" ] && [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
                TARGET="$d"
                break
              fi
            done
          fi
          if [ -z "$TARGET" ]; then
            echo "::error::Cannot find Web build output directory under app/app-web/build"
            exit 1
          fi
          echo "Using Web output directory: $TARGET"
          ls -la "$TARGET"
          (cd "$TARGET" && zip -r "${{ github.workspace }}/tvbox-web.zip" .)

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-web
          path: tvbox-web.zip
          retention-days: 30

  # ===== Linux TV 应用构建 (JVM distribution) =====
  build-linux-tv:
    name: Build Linux TV (JVM)
    needs: prepare
    if: needs.prepare.outputs.build_linux_tv == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux TV Distribution (ZIP + TAR)
        run: |
          # 注意：kotlin multiplatform + application 插件组合下，
          # installDist / distZip 默认 lib 目录中只包含主 jar，缺少运行时依赖。
          # 因此这里不用 application 插件的打包产物；直接通过 jvmJar + jvmRuntimeClasspath
          # 自行组装完整可运行目录，再打 zip/tar。
          set -euo pipefail

          ./gradlew :app:app-linux-tv:jvmJar --no-daemon --stacktrace

          # 1) 用 Gradle 把 jvmRuntimeClasspath 的 jar + 主 jar 拷贝到 build/full-libs
          ./gradlew --no-daemon --stacktrace :app:app-linux-tv:copyLinuxTvDeps \
            -PcopyLinuxTvOut="$PWD/app/app-linux-tv/build/full-libs" \
            --init-script <(cat <<'INIT'
            val targetProp = providers.gradleProperty("copyLinuxTvOut").forUseAtConfigurationTime().getOrElse("")
            if (targetProp.isNotBlank() && project.path == ":app:app-linux-tv") {
              tasks.register<Copy>("copyLinuxTvDeps") {
                into(file(targetProp))
                val jvmJar = tasks.named<org.gradle.jvm.tasks.Jar>("jvmJar")
                from(jvmJar)
                from(project.configurations.getByName("jvmRuntimeClasspath"))
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE
              }
            }
          INIT
          ) || {
            # init-script 方式在某些 Gradle 版本可能受限。兜底：直接用 Gradle 生成 classpath 列表再 shell 拷贝
            echo "[fallback] 用 shell 手工拷贝 jvm runtime 依赖..."
            OUT="$PWD/app/app-linux-tv/build/full-libs"
            mkdir -p "$OUT"
            CP=$(./gradlew :app:app-linux-tv:jvmPrintCp -q --console=plain --no-daemon \
              -PprintCpOut="$OUT/cp.txt" \
              --init-script <(cat <<'INIT2'
              val outProp = providers.gradleProperty("printCpOut").forUseAtConfigurationTime().getOrElse("")
              if (outProp.isNotBlank() && project.path == ":app:app-linux-tv") {
                tasks.register("jvmPrintCp") {
                  doLast {
                    val jars = ArrayList<File>()
                    jars.add(tasks.named<org.gradle.jvm.tasks.Jar>("jvmJar").get().archiveFile.get().asFile)
                    project.configurations.getByName("jvmRuntimeClasspath").resolve().forEach { jars.add(it) }
                    file(outProp).writeText(jars.joinToString("\n") { it.absolutePath })
                  }
                }
              }
          INIT2
            ) || true
            if [ -f "$OUT/cp.txt" ]; then
              while IFS= read -r f; do
                [ -n "$f" ] && [ -f "$f" ] && cp -f "$f" "$OUT/"
              done < "$OUT/cp.txt"
            fi
          }

          # 2) 确认 full-libs 大小
          echo "==== Linux TV full-libs ($(du -sh app/app-linux-tv/build/full-libs | cut -f1)) ===="
          ls -lh app/app-linux-tv/build/full-libs || true

          # 3) 组装分发目录：TVBox/{lib,bin}
          STAGE="$PWD/app/app-linux-tv/build/stage/TVBox"
          rm -rf "$STAGE" && mkdir -p "$STAGE/lib" "$STAGE/bin"
          cp -f app/app-linux-tv/build/full-libs/*.jar "$STAGE/lib/" 2>/dev/null || true

          # 4) 生成启动脚本 bin/TVBox：用通配符加载所有 jar（避免 classpath 太长）
          MAIN=com.tvbox.app.linuxtv.MainKt
          cat > "$STAGE/bin/TVBox" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          CP="$DIR/lib/*"
          exec java -Xmx2G -cp "$CP" com.tvbox.app.linuxtv.MainKt "$@"
          SH
          chmod +x "$STAGE/bin/TVBox"

          # 5) 打 zip/tar，并放到 workspace 根
          (cd "$STAGE/.." && zip -r "$PWD/tvbox-linux-tv.zip" "TVBox")
          tar -cf "$PWD/tvbox-linux-tv.tar" -C "$STAGE/.." "TVBox"

          # 6) 兼容：再保留 application 插件 distZip/distTar 的原版产物（如果能成功）
          ./gradlew :app:app-linux-tv:distZip :app:app-linux-tv:distTar --no-daemon --stacktrace || true
          # 打印最终 sizes
          echo "==== Linux TV 最终产物大小 ===="
          ls -lh tvbox-linux-tv.zip tvbox-linux-tv.tar
          ls -lh app/app-linux-tv/build/distributions/*.zip app/app-linux-tv/build/distributions/*.tar 2>/dev/null || true

      - name: Upload Linux TV Distribution
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-linux-tv
          path: |
            tvbox-linux-tv.zip
            tvbox-linux-tv.tar
            app/app-linux-tv/build/distributions/*.zip
            app/app-linux-tv/build/distributions/*.tar
          retention-days: 30

  # ===== 汇总发布 (仅 tag 触发) =====
  release:
    name: Publish Release
    needs: [build-android, build-desktop, build-web, build-linux-tv]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.build-android.result == 'success' ||
       needs.build-desktop.result == 'success' ||
       needs.build-web.result == 'success' ||
       needs.build-linux-tv.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List Artifacts
        run: find artifacts -type f | head -80

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TVBox ${{ github.ref_name }}
          body: |
            ## TVBox Multiplatform ${{ github.ref_name }}

            ### 下载说明
            - **Android**: 安装 `.apk` 文件到 Android TV / 手机 / 平板
            - **Windows**: 下载 `.msi` 或 `.exe` 安装包运行安装
            - **macOS**: 下载 `.dmg` 磁盘映像，拖入 Applications
            - **Linux (Debian/Ubuntu)**: 下载 `.deb` 包，`sudo dpkg -i xxx.deb`
            - **Web**: 下载 `tvbox-web.zip`，解压后用浏览器打开 `index.html`
            - **Linux TV / 嵌入式盒子**: 下载 `tvbox-linux-tv-*.zip`，解压后执行 `bin/TVBox`

            ### 构建信息
            - 构建时间: ${{ github.run_id }}
            - 提交哈希: ${{ github.sha }}
            - 工作流: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            artifacts/**/*.apk
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.pkg
            artifacts/**/tvbox-web.zip
            artifacts/**/*.zip
            artifacts/**/*.tar
          draft: false
          prerelease: false
