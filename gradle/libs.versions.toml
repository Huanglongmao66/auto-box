[versions]
kotlin = "2.0.21"
compose-multiplatform = "1.7.0"
agp = "8.7.0"
ktor = "3.0.0"
kotlinx-serialization = "1.7.3"
kotlinx-coroutines = "1.9.0"
kotlinx-datetime = "0.6.1"
sqldelight = "2.0.2"
media3 = "1.4.1"
okhttp = "4.12.0"
gson = "2.10.1"
coil = "3.0.0-rc01"
junit = "4.13.2"

[libraries]
# ===== Kotlin 标准库 =====
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# ===== Ktor 跨平台网络库 =====
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-curl = { module = "io.ktor:ktor-client-curl", version.ref = "ktor" }

# ===== SQLDelight 跨平台数据库 =====
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-jvm-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

# ===== Android Media3 (ExoPlayer) =====
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }

# ===== OkHttp (Android HTTP 客户端) =====
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# ===== Gson (Jar 爬虫依赖的 JSON 库) =====
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# ===== Coil 图片加载 (KMP) =====
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

# ===== QuickJS (Android JS 爬虫引擎) =====
quickjs-wrapper-android = { module = "wang.harlon.quickjs:wrapper-android", version = "2.1.0" }
quickjs-wrapper-java = { module = "wang.harlon.quickjs:wrapper-java", version = "2.1.0" }

# ===== JSoup (HTML 解析，JS 爬虫辅助) =====
jsoup = { module = "org.jsoup:jsoup", version = "1.14.1" }

# ===== 测试 =====
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
